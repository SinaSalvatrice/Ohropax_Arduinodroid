name: Build Ohropax.arduino

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List files in workspace
        run: ls -lR

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v1
        with:
          version: "0.32.3"

      - name: Initialize Arduino CLI config
        run: arduino-cli config init

      - name: Set board manager URL
        run: arduino-cli config set board_manager.additional_urls "https://raw.githubusercontent.com/sparkfun/Arduino_Boards/master/IDE_Board_Manager/package_sparkfun_index.json"

      - name: Install Adafruit_GFX library
        run: arduino-cli lib install "Adafruit GFX Library"

      - name: Install Adafruit_SSD1306 library
        run: arduino-cli lib install "Adafruit SSD1306"

      - name: Install Adafruit_NeoPixel library
        run: arduino-cli lib install "Adafruit NeoPixel"

      - name: Update board index
        run: arduino-cli core update-index

      - name: Search for SparkFun AVR core
        run: arduino-cli core search SparkFun

      - name: Install SparkFun AVR platform
        run: arduino-cli core install SparkFun:avr

      - name: Build working_hardware_modified.ino
        run: |
          arduino-cli compile \
            --fqbn SparkFun:avr:promicro5V16MHz \
            --output-dir "Ohropax_Arduinodroid/build" \
            "./Ohropax_Arduinodroid.ino"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: promicro-firmware
          path: Ohropax_Arduinodroid/build/*.hex
